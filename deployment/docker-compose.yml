version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: bqom-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Welcome123
      MYSQL_DATABASE: bqom
    ports:
      - "3306:3306"
    volumes:
      - bqom_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pWelcome123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - bqom-network

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bqom-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bqom?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Welcome123
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bqom-network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bqom-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - bqom-network

networks:
  bqom-network:
    driver: bridge

volumes:
  bqom_mysql_data:
    driver: local
